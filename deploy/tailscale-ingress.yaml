# Exposes the portfolio on the tailnet through the Tailscale Kubernetes operator.
#
#   https://portfolio.<tailnet>.ts.net
#
# The operator runs a small proxy that joins the tailnet as the device "portfolio" (from tls.hosts)
# and terminates TLS with a Let's Encrypt cert for that name. Requires the operator to be installed
# (ingressClassName: tailscale) and MagicDNS + HTTPS enabled for the tailnet.
# Tailnet-only by default; set the funnel annotation to "true" to make it public on the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  labels: { app: portfolio }
  annotations:
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: portfolio
      port: { name: http }
  tls:
    - hosts: [portfolio]
