# Highly available deployment of the portfolio.
#   kubectl apply -f deploy/k8s.yaml
#
# Memory: `limits.memory` is the only memory setting anywhere. The binary reads the cgroup limit
# and caps its heap at 80 % of it. No JAVA_OPTS, no -Xmx, no JAVA_TOOL_OPTIONS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  labels: { app: portfolio }
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: portfolio }
  template:
    metadata:
      labels: { app: portfolio }
    spec:
      terminationGracePeriodSeconds: 15      # > DRAIN_SECONDS + 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: portfolio }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: site
          image: docker.io/partofaplan/portfolio:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - { name: DRAIN_SECONDS, value: "5" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 64Mi }       # Guaranteed-ish QoS for memory; heap follows this number
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 1
            failureThreshold: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 1               # flips out of the Service the moment draining starts
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
spec:
  selector: { app: portfolio }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portfolio
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: portfolio }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: portfolio }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
